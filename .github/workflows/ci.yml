name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # packages/ai pulls in `canvas`, which builds from source and needs
      # cairo/pango/pixman headers that the runner image does not ship.
      - name: Install native build dependencies for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev pkg-config
      # The kernel tests provision a Python runtime through uv; without it they
      # fail with "uv is required to set up the Python kernel".
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run check:ci
      # Workspace packages resolve through node_modules symlinks to their dist/
      # output. Without a build there is no dist, so anything that imports
      # @earendil-works/pi-agent-core at runtime fails to load — which took out
      # the whole extensions and resource-loader suite.
      - run: npm run build
      - run: npm test

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./prime-agent-runtime
          python -m pip install mcp httpx
      - name: Run Python runtime tests
        run: python -m unittest discover -s prime-agent-runtime/test -v
